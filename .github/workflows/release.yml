name: Release

on:
  push:
    tags: ["v*"]
  # Dispatch builds, packages and smoke-tests the archives and stops there —
  # the rehearsal for a tag, without minting a release.
  workflow_dispatch:

# Uploading release assets needs more than the default read-only token.
permissions:
  contents: write

# Two tags racing would interleave their uploads into one draft. Queue, don't
# cancel: a cancelled release build wastes an hour of LTO.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    # A tag that disagrees with Cargo.toml ships a binary that reports the
    # wrong version. Catch that here, before the hour of LTO, not after.
    name: tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compare versions
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$crate" != "$tag" ]]; then
            echo "tag v$tag but Cargo.toml says $crate" >&2
            exit 1
          fi

  gate:
    # `ci.yml` triggers on `push: branches: [main]` and on pull requests. A tag
    # push is neither, so before this job existed a release was built, packaged
    # and drafted without fmt, clippy or a single test having run on the commit
    # being shipped. The cross-platform matrix is not repeated — it ran on main
    # before the tag was cut, and the tag points at that same commit — but the
    # gate itself must run here, because "it passed on main" is a claim about a
    # different workflow run and nothing checks that they agree.
    name: gate (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: tools/check-docs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  sounds:
    # The archives used to carry no sound, on the grounds that sounds were
    # "generated at startup" — true when the bank was synthesised, and not
    # since the recordings replaced it. A player who unpacked a release heard
    # nothing until they found and ran a fetch script, and a release is the
    # one audience that should not have to. Every recording is CC0, so the
    # archive can carry them; the scanned PBR sets stay out, because they are
    # optional and the size of everything else several times over.
    #
    # Fetched once, here, rather than in each build job: all three archives
    # then carry byte-identical files, and the people hosting them are asked
    # once per release rather than three times.
    name: fetch the sound bank
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The script has no sounds-only mode; the material sets it fetches
      # alongside are simply not uploaded.
      - run: tools/fetch-materials.sh
      # The script skips a failed download and carries on, which is right for
      # a player and wrong for a release: a dead link has to stop the release
      # here, in a minute, not ship as a silence. `REGISTER` is the one list
      # of what the bank holds — counted the way `tools/dev-setup.sh` counts
      # it — and the build jobs' audition then proves every file decodes.
      - name: Every register entry has a recording
        run: |
          mapfile -t names < <(awk '/pub const REGISTER/,/^\];/' src/audio/bank.rs \
            | sed -nE 's/^    \("([^"]+)".*/\1/p')
          if [[ "${#names[@]}" -eq 0 ]]; then
            echo "::error::read no names out of audio::bank::REGISTER — has its layout changed?"
            exit 1
          fi
          missing=0
          for name in "${names[@]}"; do
            if ! compgen -G "assets/sounds/$name.*" >/dev/null; then
              echo "::error::no recording fetched for '$name'"
              missing=$((missing + 1))
            fi
          done
          echo "${#names[@]} register entries, $missing without a recording"
          [[ "$missing" -eq 0 ]]
      - uses: actions/upload-artifact@v7
        with:
          name: sound-bank
          path: assets/sounds/
          if-no-files-found: error
          retention-days: 7

  build:
    name: build (${{ matrix.name }})
    needs: [version, gate, sounds]
    # `needs` would otherwise skip this job whenever `version` is skipped,
    # which is exactly the workflow_dispatch case.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: a Linux binary needs the glibc it was linked
          # against or newer, so the build runner decides which distributions
          # can start the game at all. 22.04 is glibc 2.35, which Debian 12
          # and every current desktop distribution clear; the 24.04 image
          # would quietly raise the floor to 2.39.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          # Apple silicon only — the three platforms the first release was
          # asked for. An Intel Mac is one more entry here, cross-compiled
          # from this same arm64 runner, whose Xcode links both.
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Bevy links ALSA and libudev on Linux; neither is on the runner image.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Default features only. `dev` (dynamic linking) must never ship, and
      # `raytracing`/`dlss` stay opt-in builds for the people who ask for them.
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/download-artifact@v8
        with:
          name: sound-bank
          path: sound-bank

      # The archive mirrors the source tree's layout because that is what the
      # game expects at runtime: `core::assets::root()` finds `assets/` next to
      # the executable, and the fetch script resolves paths from its own
      # location under `tools/`, so the optional texture upgrade works in place.
      #
      # `assets/` is copied whole. Nothing gitignored is ever in it on this
      # runner — the bank arrives in `sound-bank/`, and no materials are
      # fetched — so the whole directory is exactly what is checked in. This
      # step used to copy `assets/shaders` by name, and Landshüpf's atlas sat
      # one directory over: every archive would have fallen back to the
      # generator with a warning in a log nobody reads. A directory added under
      # `assets/` next now ships without anybody remembering this step.
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "${GITHUB_REF}" == refs/tags/* ]] || version="dev-${GITHUB_SHA::7}"
          pkg="mood-swings-${version}-${{ matrix.name }}"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          mkdir -p "dist/$pkg/tools"
          cp -R assets "dist/$pkg/"
          cp -R sound-bank "dist/$pkg/assets/sounds"
          # CREDITS.md carries the ODbL attribution the atlas requires, and
          # names everybody whose recording is now in the archive.
          cp README.md LICENSE CREDITS.md "dist/$pkg/"
          if [[ "${{ runner.os }}" == Windows ]]; then
            cp "target/${{ matrix.target }}/release/mood_swings.exe" "dist/$pkg/"
            cp tools/fetch-materials.bat "dist/$pkg/tools/"
            (cd dist && 7z a -bso0 "$pkg.zip" "$pkg")
          else
            cp "target/${{ matrix.target }}/release/mood_swings" "dist/$pkg/"
            cp tools/fetch-materials.sh "dist/$pkg/tools/"
            tar czf "dist/$pkg.tar.gz" -C dist "$pkg"
          fi

      # Unpack what will ship into an empty directory and run *that*. Both
      # instruments return before Bevy starts, so they need no window and no
      # GPU, and between them they ask the two questions a missing file would
      # otherwise only answer in a player's log: does every sound decode
      # (`--audition` prints MISSING for one that does not), and did Landshüpf
      # load from its atlas (the survey prints a coverage line only for a town
      # with a map under it; the generator's fallback reads "n/a").
      #
      # The checkout's own `assets/` is moved aside first. `root()` prefers the
      # manifest directory baked in at compile time to the executable's, and
      # on this runner that directory exists — so with it in place the
      # archive's binary would read the checkout's files, and an archive
      # missing one would pass.
      - name: Smoke-test the archive
        shell: bash
        run: |
          mv assets assets.checkout
          # Inside the workspace rather than `$RUNNER_TEMP`, whose Windows
          # form is a backslashed drive path; `$PWD` is spelled the POSIX way
          # by every shell here, Git Bash included.
          work="$PWD"
          mkdir smoke
          cd smoke
          if [[ "${{ runner.os }}" == Windows ]]; then
            7z x -bso0 "$work/dist/$PKG.zip"
            exe=./mood_swings.exe
          else
            tar xzf "$work/dist/$PKG.tar.gz"
            exe=./mood_swings
          fi
          cd "$PKG"

          "$exe" --audition "$work/audition" | tee "$work/audition.log"
          if grep -q '^MISSING' "$work/audition.log"; then
            echo "::error::the archive's sound bank is incomplete"
            exit 1
          fi

          "$exe" --survey --city landshuepf | tee "$work/survey.log"
          if ! grep -q '^coverage   bake' "$work/survey.log"; then
            echo "::error::Landshüpf did not load its atlas from the archive"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mood-swings-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    # One job creates the release after every platform built, so a broken
    # Windows link never leaves a half-populated release page.
    name: draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      # By pattern: the run also holds the `sound-bank` artifact, and merged
      # in here it would put fifty-odd loose recordings on the release page.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: mood-swings-*
          merge-multiple: true
      # One file listing every archive's digest, so a download can be checked
      # without trusting the page it came from. Generated here rather than per
      # build job because a checksum file per platform is three files nobody
      # concatenates.
      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS
      # Draft on purpose: the generated notes get a once-over and the publish
      # button is the human sign-off.
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Mood Swings ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
