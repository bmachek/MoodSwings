name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless across runners and dominate the cache.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # CLAUDE.md and AGENTS.md are twins, like the two fetch scripts. They had
      # drifted forty-two lines apart before anything checked. Needs no
      # toolchain, so it runs first and fails in seconds.
      - run: tools/check-docs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Bevy links ALSA and libudev on Linux; neither is on the runner image.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # `raytracing` gates one `#[cfg(feature)]` block that probes the GPU for
      # the wgpu features `bevy_solari` needs. Nothing else in the tree compiles
      # it, so a Bevy point release that moves `SolariPlugins::required_wgpu_features`
      # would break that build with nobody watching. `check` rather than
      # `build`, because the question is whether it still compiles, not whether
      # it links — and `bevy_solari` is not cheap.
      #
      # No `dlss` counterpart: it needs the vendor SDK, which is not on a
      # runner and cannot be put there. That one stays unverified, and
      # CLAUDE.md says so.
      - run: cargo check --locked --features raytracing

  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # Building the binary is the part that proves the game links on this
      # platform; `cargo test` alone only ever builds the test harness.
      - run: cargo build --locked
      - run: cargo test --locked --workspace

  multiplayer-server:
    name: dedicated server container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 30
      - run: docker compose exec -T server mood-server --check 127.0.0.1:7777
      - if: always()
        run: docker compose logs server
      - if: always()
        run: docker compose down
