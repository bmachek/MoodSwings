name: An idea
description: Something the city should do that it does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before writing: this was an open-world crime sandbox and
        it is now a comedy one. There are no weapons, no police, no health and
        no fail state — those are the design rather than a gap. The verb is
        provocation and the readout is a mood, and when a change has to break a
        tie it breaks towards the joke.

        `README.md`'s **Known limitations** is thirty entries long and honest
        about what is missing on purpose. Worth a look first; it may already be
        there with the reasoning attached.

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should happen, and what it would be like to play.
    validations:
      required: true

  - type: textarea
    id: joke
    attributes:
      label: Where is the joke
      description: >
        Not a formality. The best features here are the ones that are funny
        before they are impressive — a flummi that will not let a raspberry go
        and hops after you for two streets is the whole game in one behaviour.
    validations:
      required: true

  - type: dropdown
    id: known
    attributes:
      label: Is it already in README's Known limitations?
      options:
        - "No, I looked"
        - "Yes, but I think the reasoning has changed"
        - "Have not looked"
    validations:
      required: true
