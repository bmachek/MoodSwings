name: It will not build or start
description: A fresh clone that does not get as far as a window.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Four setup failures here are silent, and `tools/dev-setup.sh` exists to
        name all four. **Run it first and paste what it says** — it reports the
        rustc version against the `rust-version` in Cargo.toml, the ALSA and
        libudev headers Bevy links on Linux, the sound bank, and whether there
        is a graphics adapter at all.

  - type: textarea
    id: setup
    attributes:
      label: What `tools/dev-setup.sh` reported
      render: text
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: The error
      description: >
        The first error, not the last. A rustc older than the one Cargo.toml
        asks for reports as one error naming eleven packages, which reads like a
        dependency problem and is not.
      render: text
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: What you ran
      placeholder: "cargo run --release"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Machine
      placeholder: "Ubuntu 24.04, no GPU, rustc 1.95.0, fresh clone"
    validations:
      required: true
